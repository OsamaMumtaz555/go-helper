services:
  - type: web
    name: go-helper-admin
    runtime: python
    plan: free
    branch: main
    rootDir: admin_portal
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
